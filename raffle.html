<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Raffle</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#1a0b3d;--bg2:#0d1b5e;--gold:#ffc61a;--pink:#ff4fa3}
  body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#4b1fa8 0,transparent 45%),radial-gradient(circle at 90% 90%,#1746c9 0,transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;color:#fff}
  .glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
  .gold-btn{background:linear-gradient(180deg,#ffe066,var(--gold));color:#2a1260;box-shadow:0 6px 0 #c48f00,0 12px 30px rgba(255,198,26,.35);transition:transform .1s,box-shadow .1s}
  .gold-btn:hover:not(:disabled){transform:translateY(2px);box-shadow:0 4px 0 #c48f00,0 10px 26px rgba(255,198,26,.4)}
  .gold-btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 0 0 #c48f00}
  .gold-btn:disabled{opacity:.45;cursor:not-allowed}
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3) translateX(-20px);opacity:0}100%{transform:none;opacity:1}}
  .bump{animation:bump .5s}
  @keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}
  .wheelpulse{animation:wp .45s}
  @keyframes wp{40%{transform:scale(1.035)}}
  #plist::-webkit-scrollbar{width:8px}#plist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
  input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- Phone view (opened from the QR code) -->
<main id="phone" class="hidden min-h-screen flex-col items-center justify-center p-6 text-center">
  <h1 class="text-4xl font-extrabold mb-2">You're almost in!</h1>
  <p class="text-lg text-purple-200 mb-6">Enter your name to join the raffle.</p>
  <form id="phoneForm" class="w-full max-w-sm flex flex-col gap-3">
    <input id="phoneName" maxlength="24" required placeholder="Your Name" class="rounded-xl px-4 py-4 text-xl text-purple-950 font-bold" autocomplete="name">
    <button class="gold-btn rounded-xl py-4 text-xl font-extrabold">Join</button>
  </form>
  <p id="phoneMsg" class="mt-5 text-xl text-yellow-300 font-bold"></p>
</main>

<!-- Projection view -->
<div id="stage" class="min-h-screen grid lg:grid-cols-[minmax(320px,2fr)_3fr] gap-6 p-6">

  <!-- LEFT: registration -->
  <section class="glass rounded-3xl p-8 flex flex-col items-center justify-center text-center">
    <h1 class="text-4xl xl:text-5xl font-extrabold leading-tight mb-2">Scan the QR code to enter your name in the raffle</h1>
    <div class="bg-white p-4 rounded-3xl my-6 shadow-[0_0_60px_rgba(255,198,26,.35)]"><div id="qr"></div></div>
    <form id="form" class="w-full max-w-sm flex gap-2">
      <input id="name" maxlength="24" placeholder="Your Name" aria-label="Your Name" class="flex-1 min-w-0 rounded-xl px-4 py-3 text-lg text-purple-950 font-bold" autocomplete="off">
      <button class="gold-btn rounded-xl px-6 py-3 text-lg font-extrabold">Join</button>
    </form>
    <p id="joinHint" class="mt-3 text-sm text-purple-300 max-w-sm"></p>
  </section>

  <!-- RIGHT: live display -->
  <section class="glass rounded-3xl p-6 flex flex-col min-h-0">
    <div class="grid xl:grid-cols-[1fr_260px] gap-6 flex-1 min-h-0">
      <div class="flex flex-col items-center justify-center">
        <div id="wheelWrap" class="relative w-full max-w-[560px] aspect-square">
          <div class="absolute left-1/2 -top-1 -translate-x-1/2 z-10 w-0 h-0 drop-shadow-lg"
               style="border-left:20px solid transparent;border-right:20px solid transparent;border-top:44px solid var(--gold)"></div>
          <canvas id="wheel" class="w-full h-full"></canvas>
          <div id="placeholder" class="absolute inset-[9%] rounded-full flex items-center justify-center text-center p-10 text-xl font-bold text-purple-100 bg-[#1a0b3d]/90 border-4 border-dashed border-purple-400/60">
            <span id="phText"></span>
          </div>
        </div>
        <button id="spin" class="gold-btn rounded-2xl px-10 py-4 mt-6 text-3xl font-extrabold" disabled>Spin the Wheel!</button>
      </div>

      <div class="flex flex-col min-h-0 max-h-[70vh] xl:max-h-none">
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="text-2xl font-extrabold">Participants</h2>
          <div><span id="count" class="text-5xl font-extrabold text-yellow-300">0</span><span class="text-purple-200 ml-1">joined</span></div>
        </div>
        <ul id="plist" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[120px]"></ul>
        <div class="flex gap-4 mt-4 text-sm text-purple-300">
          <button id="sample" class="underline hover:text-white">Add 5 Sample Names</button>
          <button id="clear" class="underline hover:text-white">Clear all</button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Winner modal -->
<div id="modal" class="hidden fixed inset-0 z-40 items-center justify-center bg-black/70 p-6">
  <div class="pop glass rounded-3xl p-10 text-center max-w-lg w-full" style="background:linear-gradient(160deg,#4b1fa8,#0d1b5e)">
    <p class="text-2xl text-purple-200 font-bold">And the winner is</p>
    <h2 id="winner" class="text-6xl font-extrabold text-yellow-300 my-5 break-words"></h2>
    <div class="flex flex-col sm:flex-row gap-3 justify-center mt-6">
      <button id="removeBtn" class="gold-btn rounded-xl px-6 py-3 text-lg font-extrabold">Remove winner</button>
      <button id="resetBtn" class="rounded-xl px-6 py-3 text-lg font-bold border-2 border-white/40 hover:bg-white/10">Reset wheel</button>
    </div>
  </div>
</div>
<canvas id="confetti" class="fixed inset-0 z-50 pointer-events-none"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLORS = ['#7c3aed','#2563eb','#ffc61a','#ec4899','#06b6d4','#f97316','#8b5cf6','#3b82f6'];
  const TEXT = {'#ffc61a':'#2a1260','#06b6d4':'#0b1e4a','#f97316':'#2a1260'};
  const SAMPLES = ['Ana','Mateo','Sofía','Lucas','Valentina','Diego','Camila','Bruno','Lucía','Nico','Martina','Andrés'];
  const store = { load(){ try{return JSON.parse(localStorage.getItem('raffle_names')||'[]')}catch(e){return []} },
                  save(v){ try{localStorage.setItem('raffle_names',JSON.stringify(v))}catch(e){} } };
  let names = store.load();
  let rot = 0, spinning = false, winnerIdx = -1;
  let chan = null; try{ chan = new BroadcastChannel('raffle'); }catch(e){}

  // ---------- Phone mode ----------
  if (location.hash === '#join') {
    $('stage').classList.add('hidden');
    $('phone').classList.remove('hidden'); $('phone').classList.add('flex');
    $('phoneForm').addEventListener('submit', e => {
      e.preventDefault();
      const n = $('phoneName').value.trim(); if (!n) return;
      chan && chan.postMessage({join:n});
      try{ const cur = store.load(); cur.push(n); store.save(cur); }catch(e){}
      $('phoneMsg').textContent = `You're in, ${n}! Watch the big screen.`;
      $('phoneName').value = '';
    });
    return;
  }

  // ---------- QR ----------
  const joinUrl = location.href.split('#')[0] + '#join';
  new QRCode($('qr'), {text: joinUrl, width: 260, height: 260, colorDark:'#1a0b3d', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M});
  if (location.protocol === 'file:')
    $('joinHint').textContent = 'Tip: host this file online so phones can open the QR link.';

  // ---------- Wheel drawing ----------
  const cv = $('wheel'), ctx = cv.getContext('2d');
  function size(){ const r = cv.getBoundingClientRect(), d = devicePixelRatio||1; cv.width = r.width*d; cv.height = r.height*d; draw(); }
  function draw(){
    const W = cv.width, c = W/2, R = c*0.93;
    ctx.clearRect(0,0,W,W);
    const n = names.length;
    ctx.save(); ctx.translate(c,c);
    // outer ring
    ctx.beginPath(); ctx.arc(0,0,R+W*0.02,0,7); ctx.fillStyle = '#ffc61a'; ctx.fill();
    if (n >= 2) {
      const a = Math.PI*2/n;
      names.forEach((nm,i) => {
        const col = COLORS[i % COLORS.length] + (n % COLORS.length === 1 && i === n-1 ? '' : '');
        ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R, rot+i*a, rot+(i+1)*a); ctx.closePath();
        ctx.fillStyle = (n % COLORS.length === 1 && i === n-1) ? '#ec4899' : col; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.save(); ctx.rotate(rot + (i+.5)*a); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = TEXT[col] || '#fff';
        const fs = Math.max(W*0.028, Math.min(W*0.06, R*a*0.42));
        ctx.font = `800 ${fs}px 'Bricolage Grotesque',sans-serif`;
        let t = nm; while (ctx.measureText(t).width > R*0.72 && t.length > 3) t = t.slice(0,-2);
        if (t !== nm) t += '…';
        ctx.fillText(t, R*0.92, 0); ctx.restore();
      });
    } else {
      ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fillStyle = '#2b1670'; ctx.fill();
    }
    // hub
    ctx.beginPath(); ctx.arc(0,0,W*0.06,0,7); ctx.fillStyle = '#ffc61a'; ctx.fill();
    ctx.lineWidth = W*0.012; ctx.strokeStyle = '#2a1260'; ctx.stroke();
    ctx.restore();
  }

  // ---------- List & state ----------
  function render(newName){
    const ul = $('plist'); ul.innerHTML = '';
    names.forEach((n,i) => {
      const li = document.createElement('li');
      li.className = 'flex items-center gap-3 rounded-xl px-3 py-2 bg-white/10 font-bold text-lg' + (i === names.length-1 && newName ? ' pop' : '');
      const dot = document.createElement('span'); dot.className = 'w-4 h-4 rounded-full shrink-0'; dot.style.background = COLORS[i % COLORS.length];
      const t = document.createElement('span'); t.className = 'truncate'; t.textContent = n;
      li.append(dot, t); ul.append(li);
    });
    if (newName) ul.scrollTop = ul.scrollHeight;
    const c = $('count'); c.textContent = names.length; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
    const few = names.length < 2;
    $('placeholder').style.display = few ? 'flex' : 'none';
    $('phText').textContent = names.length === 0 ? 'Waiting for players… scan the QR code to join!' : 'One down! We need at least 2 people to spin.';
    $('spin').disabled = few || spinning;
    if (newName){ const w = $('wheelWrap'); w.classList.remove('wheelpulse'); void w.offsetWidth; w.classList.add('wheelpulse'); }
    store.save(names); draw();
  }
  function add(n){ n = (n||'').trim().slice(0,24); if (!n) return false; names.push(n); render(true); return true; }

  $('form').addEventListener('submit', e => { e.preventDefault(); if (add($('name').value)) $('name').value = ''; $('name').focus(); });
  $('sample').onclick = () => { const pool = SAMPLES.filter(s => !names.includes(s)); (pool.length>=5?pool:SAMPLES).sort(()=>Math.random()-.5).slice(0,5).forEach((s,i)=>setTimeout(()=>add(s),i*250)); };
  $('clear').onclick = () => { if (spinning) return; names = []; render(); };
  chan && (chan.onmessage = e => { if (e.data && e.data.join) add(e.data.join); });
  window.addEventListener('storage', e => { if (e.key === 'raffle_names' && !spinning){ names = store.load(); render(); } });

  // ---------- Spin ----------
  const TAU = Math.PI*2;
  $('spin').onclick = () => {
    if (spinning || names.length < 2) return;
    spinning = true; $('spin').disabled = true;
    const n = names.length, a = TAU/n; winnerIdx = Math.floor(Math.random()*n);
    const jitter = (Math.random()-.5)*a*0.7;
    const target = -Math.PI/2 - (winnerIdx+.5)*a + jitter;
    const delta = (((target - rot) % TAU) + TAU) % TAU + TAU*(6 + Math.floor(Math.random()*2));
    const start = rot, dur = 4000 + Math.random()*1000, t0 = performance.now();
    (function tick(now){
      const p = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-p,4);
      rot = start + delta*e; draw();
      if (p < 1) requestAnimationFrame(tick); else finish();
    })(t0);
  };
  function finish(){
    spinning = false;
    $('winner').textContent = names[winnerIdx];
    $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
    burst();
  }
  function closeModal(){ $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); }
  $('removeBtn').onclick = () => { names.splice(winnerIdx,1); closeModal(); render(); };
  $('resetBtn').onclick = () => { closeModal(); rot = 0; render(); };

  // ---------- Confetti ----------
  const fc = $('confetti'), fx = fc.getContext('2d'); let bits = [], raf;
  function burst(){
    fc.width = innerWidth; fc.height = innerHeight;
    const cols = ['#ffc61a','#ffe066','#ff4fa3','#7c3aed','#3b82f6','#ffffff'];
    for (let i=0;i<220;i++){
      const left = i%2; bits.push({x: left?0:fc.width, y: fc.height*0.75, vx:(left?1:-1)*(6+Math.random()*12), vy:-(10+Math.random()*16),
        w:6+Math.random()*8, h:10+Math.random()*10, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:0});
    }
    cancelAnimationFrame(raf); loop();
  }
  function loop(){
    fx.clearRect(0,0,fc.width,fc.height);
    bits.forEach(b => { b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
      fx.save(); fx.translate(b.x,b.y); fx.rotate(b.r); fx.fillStyle = b.c; fx.fillRect(-b.w/2,-b.h/2,b.w,b.h); fx.restore(); });
    bits = bits.filter(b => b.y < fc.height+30 && b.life < 300);
    if (bits.length) raf = requestAnimationFrame(loop); else fx.clearRect(0,0,fc.width,fc.height);
  }

  addEventListener('resize', size);
  render(); size();
})();
</script>
</body>
</html>
